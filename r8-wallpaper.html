<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Audi R8</title>
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }

  #bg {
    position: fixed;
    inset: 0;
    background: url('r8-bg.jpg') center center / cover no-repeat;
    filter: brightness(0.88) saturate(0.9) contrast(1.05);
  }

  /* Dark cinematic color grade overlay */
  #grade {
    position: fixed;
    inset: 0;
    background: linear-gradient(160deg, rgba(5,8,20,0.28) 0%, rgba(0,0,0,0) 50%, rgba(3,6,18,0.35) 100%);
    mix-blend-mode: multiply;
    pointer-events: none;
  }

  canvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
  }
</style>
</head>
<body>
  <div id="bg"></div>
  <div id="grade"></div>
  <canvas id="c"></canvas>

<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W, H, t = 0, last = 0;

function resize() {
  W = cv.width = window.innerWidth;
  H = cv.height = window.innerHeight;
  initDrops();
}
window.addEventListener('resize', resize);

// ── Rain streaks (scene rain, matching photo) ─────────────────────────────────
const STREAKS = Array.from({ length: 180 }, (_, i) => ({
  x: Math.random(),
  y: Math.random(),
  len: (10 + (i * 17) % 18) / 1080,
  spd: (0.22 + (i * 7 % 9) * 0.02) / 100,
  a: 0.08 + (i % 6) * 0.025,
}));

// ── Bokeh lights (from the mall signs / street lights in bg) ──────────────────
const BOKEH = Array.from({ length: 28 }, (_, i) => ({
  x: Math.random(),
  y: 0.05 + Math.random() * 0.55,
  r: 18 + (i * 23 % 55),
  hue: (i * 37) % 2 === 0 ? 38 + (i * 11 % 18) : 200 + (i * 7 % 30),
  a: 0.04 + (i % 5) * 0.025,
  ph: i * 0.83,
  driftX: (Math.random() - 0.5) * 0.00008,
  driftY: (Math.random() - 0.5) * 0.00005,
}));

// ── Lens rain drops (large drops on the "camera lens") ────────────────────────
let drops = [];

function initDrops() {
  drops = Array.from({ length: 14 }, (_, i) => spawnDrop(i * (H / 14)));
}

function spawnDrop(startY) {
  return {
    x: 0.05 + Math.random() * 0.9,
    y: startY !== undefined ? startY / H : -0.05,
    r: (20 + Math.random() * 35) / 1080,
    spd: (0.6 + Math.random() * 1.1) / 100,
    alpha: 0.55 + Math.random() * 0.3,
    wobble: Math.random() * Math.PI * 2,
    wobbleSpd: 0.8 + Math.random() * 1.2,
  };
}

// ── Film grain ────────────────────────────────────────────────────────────────
let grainCanvas, grainCtx;
function buildGrain() {
  grainCanvas = document.createElement('canvas');
  grainCanvas.width = 256;
  grainCanvas.height = 256;
  grainCtx = grainCanvas.getContext('2d');
}
buildGrain();

function updateGrain() {
  const id = grainCtx.createImageData(256, 256);
  const d = id.data;
  for (let i = 0; i < d.length; i += 4) {
    const v = (Math.random() * 255) | 0;
    d[i] = d[i+1] = d[i+2] = v;
    d[i+3] = 18;
  }
  grainCtx.putImageData(id, 0, 0);
}

// ── Vignette (drawn once, stamped each frame) ─────────────────────────────────
let vigCanvas;
function buildVignette() {
  vigCanvas = document.createElement('canvas');
  vigCanvas.width = 4;
  vigCanvas.height = 4;
  // will be drawn via radial gradient each frame (cheaper than a pre-rendered canvas since it's only 1 fillRect)
}
buildVignette();

// ── Draw ──────────────────────────────────────────────────────────────────────

function drawStreaks(dt) {
  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineWidth = 0.9;
  STREAKS.forEach(s => {
    s.x -= 0.00055 * dt * 60;
    s.y += s.spd * dt * 60;
    if (s.y > 1.06) { s.y = -0.04; s.x = Math.random(); }
    if (s.x < -0.01) s.x = 1.01;
    const sx = s.x * W, sy = s.y * H, sl = s.len * H;
    ctx.globalAlpha = s.a;
    ctx.strokeStyle = 'rgba(190,215,255,1)';
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(sx + sl * 0.14, sy - sl);
    ctx.stroke();
  });
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawBokeh(dt) {
  ctx.save();
  BOKEH.forEach(b => {
    b.x += b.driftX * dt * 60;
    b.y += b.driftY * dt * 60;
    if (b.x < -0.1) b.x = 1.1;
    if (b.x > 1.1) b.x = -0.1;
    if (b.y < -0.1) b.y = 1.1;
    if (b.y > 1.1) b.y = -0.1;

    const pulse = 0.75 + 0.25 * Math.sin(t * 0.9 + b.ph);
    const bx = b.x * W, by = b.y * H, br = b.r;

    const g = ctx.createRadialGradient(bx, by, 0, bx, by, br);
    const sat = b.hue < 100 ? '80%' : '60%';
    g.addColorStop(0,   `hsla(${b.hue},${sat},75%,${b.a * pulse * 1.2})`);
    g.addColorStop(0.5, `hsla(${b.hue},${sat},65%,${b.a * pulse * 0.6})`);
    g.addColorStop(1,   `hsla(${b.hue},${sat},55%,0)`);

    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(bx, by, br, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawLensDrops(dt) {
  ctx.save();
  drops.forEach(d => {
    d.y += d.spd * dt * 60;
    d.wobble += d.wobbleSpd * dt;
    d.x += Math.sin(d.wobble) * 0.00015 * dt * 60;

    if (d.y > 1.1) {
      Object.assign(d, spawnDrop());
    }

    const dx = d.x * W;
    const dy = d.y * H;
    const dr = d.r * H;

    // Clip to drop shape
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(dx, dy, dr * 0.75, dr, 0, 0, Math.PI * 2);
    ctx.clip();

    // Slight refraction: redraw a shifted, brightened portion of background
    // Simulated with a soft white-to-transparent fill + tinted inner area
    const innerG = ctx.createRadialGradient(dx - dr * 0.2, dy - dr * 0.3, 0, dx, dy, dr);
    innerG.addColorStop(0,   `rgba(210,225,245,${d.alpha * 0.18})`);
    innerG.addColorStop(0.4, `rgba(180,200,230,${d.alpha * 0.08})`);
    innerG.addColorStop(1,   `rgba(100,130,180,${d.alpha * 0.04})`);
    ctx.fillStyle = innerG;
    ctx.fillRect(dx - dr, dy - dr, dr * 2, dr * 2);

    ctx.restore();

    // Drop border (the glassy edge)
    ctx.beginPath();
    ctx.ellipse(dx, dy, dr * 0.75, dr, 0, 0, Math.PI * 2);
    const borderG = ctx.createLinearGradient(dx - dr, dy - dr, dx + dr, dy + dr);
    borderG.addColorStop(0,   `rgba(255,255,255,${d.alpha * 0.55})`);
    borderG.addColorStop(0.45,`rgba(200,220,255,${d.alpha * 0.25})`);
    borderG.addColorStop(1,   `rgba(80,110,170,${d.alpha * 0.15})`);
    ctx.strokeStyle = borderG;
    ctx.lineWidth = 1.2;
    ctx.stroke();

    // Specular highlight (small bright dot top-left of drop)
    ctx.beginPath();
    ctx.ellipse(dx - dr * 0.28, dy - dr * 0.38, dr * 0.14, dr * 0.1, -0.4, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${d.alpha * 0.65})`;
    ctx.fill();
  });
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawTaillightGlow() {
  // Approx position of the R8's taillights in the photo (center-right area, lower third)
  // Photo is the rear 3/4 view; taillights are visible right-center
  const tlX = W * 0.62, tlY = H * 0.68;
  const tlX2 = W * 0.38, tlY2 = H * 0.72;

  const pulse = 0.82 + 0.18 * Math.sin(t * 2.2);

  ctx.save();
  [{ x: tlX, y: tlY, r: W * 0.09 }, { x: tlX2, y: tlY2, r: W * 0.06 }].forEach(tl => {
    const g = ctx.createRadialGradient(tl.x, tl.y, 0, tl.x, tl.y, tl.r);
    g.addColorStop(0,   `rgba(255,20,0,${0.28 * pulse})`);
    g.addColorStop(0.4, `rgba(200,0,0,${0.12 * pulse})`);
    g.addColorStop(1,   'rgba(120,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(tl.x - tl.r, tl.y - tl.r, tl.r * 2, tl.r * 2);
  });
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawVignette() {
  const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.9);
  g.addColorStop(0,   'rgba(0,0,0,0)');
  g.addColorStop(0.6, 'rgba(0,0,0,0.08)');
  g.addColorStop(1,   'rgba(0,0,0,0.55)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function drawGrain() {
  ctx.save();
  ctx.globalAlpha = 0.045;
  ctx.globalCompositeOperation = 'screen';
  const pat = ctx.createPattern(grainCanvas, 'repeat');
  ctx.fillStyle = pat;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

// ── Loop ─────────────────────────────────────────────────────────────────────

function frame(ts) {
  const dt = Math.min((ts - last) / 1000, 0.05);
  last = ts;
  t += dt;

  ctx.clearRect(0, 0, W, H);

  updateGrain();

  drawBokeh(dt);
  drawStreaks(dt);
  drawTaillightGlow();
  drawLensDrops(dt);
  drawVignette();
  drawGrain();

  requestAnimationFrame(frame);
}

resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
