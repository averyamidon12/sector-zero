<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SECTOR ZERO</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; display:flex; align-items:center; justify-content:center; height:100vh; overflow:hidden; }
canvas { display:block; cursor:none; image-rendering:pixelated; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ============================================================
// 1. CONSTANTS & CONFIG
// ============================================================
const W = 800, H = 600;
const PLAYER_SPEED  = 190;
const BULLET_SPEED  = 540;
const FIRE_RATE     = 0.16;
const AMMO_MAX      = 24;
const RELOAD_TIME   = 1.6;
const ENEMY_BULLET_SPEED = 280;

const PAL = {
  bg:'#0a0a14', grid:'#12121e',
  playerBody:'#3a8fd4', playerHead:'#5aafff', playerGun:'#7090c0', playerLegs:'#2060a0',
  runner:'#e05020', runnerDark:'#902010',
  scout:'#e0a000', scoutDark:'#906000',
  tank:'#8040c0', tankDark:'#502080',
  ranged:'#d040a0', rangedDark:'#901060',
  bullet:'#ffee00', bulletGlow:'#ff8800',
  eBullet:'#ff3030',
  flash:'#ffffff',
  hpFull:'#20dd60', hpMid:'#dddd20', hpLow:'#dd2020',
  uiBg:'rgba(0,0,0,0.6)', uiText:'#c0d0ff',
};

// ============================================================
// 2. LEVEL DATA
// ============================================================
const LEVELS = [
  { name:'SECTOR 1', waves:[
    { spawns:[{ type:'runner', count:5, interval:1.4 }] },
    { spawns:[{ type:'runner', count:7, interval:1.1 }, { type:'scout', count:2, interval:1.8 }] },
    { spawns:[{ type:'tank',   count:2, interval:3.0 }, { type:'runner',count:5, interval:1.0 }], isBoss:true },
  ]},
  { name:'SECTOR 2', waves:[
    { spawns:[{ type:'scout',  count:6, interval:0.9 }, { type:'runner', count:3, interval:1.2 }] },
    { spawns:[{ type:'runner', count:6, interval:0.9 }, { type:'tank',   count:2, interval:3.5 }] },
    { spawns:[{ type:'tank',   count:3, interval:2.5 }, { type:'scout',  count:5, interval:0.7 }, { type:'ranged', count:2, interval:4.0 }], isBoss:true },
  ]},
  { name:'SECTOR 3', waves:[
    { spawns:[{ type:'ranged', count:4, interval:2.0 }, { type:'scout', count:5, interval:0.7 }] },
    { spawns:[{ type:'runner', count:8, interval:0.8 }, { type:'ranged', count:3, interval:2.5 }, { type:'tank', count:2, interval:3.0 }] },
    { spawns:[{ type:'tank',   count:4, interval:2.0 }, { type:'ranged', count:5, interval:1.5 }, { type:'scout', count:8, interval:0.5 }], isBoss:true },
  ]},
];

// ============================================================
// 3. CANVAS & CONTEXT
// ============================================================
const canvas = document.getElementById('c');
canvas.width = W; canvas.height = H;
const ctx = canvas.getContext('2d');

// Scale canvas to fit window
function resize() {
  const s = Math.min(window.innerWidth/W, window.innerHeight/H);
  canvas.style.width  = (W*s)+'px';
  canvas.style.height = (H*s)+'px';
}
resize();
window.addEventListener('resize', resize);

// ============================================================
// 4. INPUT SYSTEM
// ============================================================
const keys = {};
const mouse = { x:W/2, y:H/2, down:false, justPressed:false };

window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.key] = false; });
canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  const scaleX = W / r.width, scaleY = H / r.height;
  mouse.x = (e.clientX - r.left) * scaleX;
  mouse.y = (e.clientY - r.top)  * scaleY;
});
canvas.addEventListener('mousedown', () => { mouse.down = true; mouse.justPressed = true; });
canvas.addEventListener('mouseup',   () => { mouse.down = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());

// ============================================================
// 5. AUDIO (Web Audio API procedural synth)
// ============================================================
let audioCtx = null;
function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playTone(freq, dur, type='square', vol=0.18, sweep=null) {
  if (!audioCtx) return;
  try {
    const osc  = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    if (sweep) osc.frequency.exponentialRampToValueAtTime(sweep, audioCtx.currentTime + dur);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.start(); osc.stop(audioCtx.currentTime + dur + 0.01);
  } catch(e) {}
}

function playNoise(dur, vol=0.15) {
  if (!audioCtx) return;
  try {
    const buf  = audioCtx.createBuffer(1, audioCtx.sampleRate * dur, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i=0; i<data.length; i++) data[i] = Math.random()*2-1;
    const src  = audioCtx.createBufferSource();
    const gain = audioCtx.createGain();
    src.buffer = buf; src.connect(gain); gain.connect(audioCtx.destination);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    src.start(); src.stop(audioCtx.currentTime + dur + 0.01);
  } catch(e) {}
}

function sfxShoot()     { playTone(520, 0.06, 'square', 0.12); }
function sfxHit()       { playNoise(0.04, 0.18); }
function sfxExplode()   { playTone(180, 0.35, 'sawtooth', 0.22, 40); playNoise(0.25, 0.12); }
function sfxPlayerHit() { playTone(120, 0.15, 'sawtooth', 0.25); }
function sfxWaveClear() {
  [330,440,550,660].forEach((f,i) => setTimeout(()=>playTone(f,0.18,'square',0.14), i*90));
}
function sfxLevelClear() {
  [330,440,550,660,880].forEach((f,i) => setTimeout(()=>playTone(f,0.22,'square',0.16), i*80));
}
function sfxReload() { playTone(220, 0.08, 'square', 0.10); playTone(330, 0.08, 'square', 0.10); }

// ============================================================
// 6. PARTICLE SYSTEM
// ============================================================
let particles = [];

function spawnParticles(x, y, count, opts) {
  for (let i=0; i<count; i++) {
    const angle = opts.angle !== undefined ? opts.angle + (Math.random()-0.5)*opts.spread : Math.random()*Math.PI*2;
    const speed = opts.minSpeed + Math.random()*(opts.maxSpeed - opts.minSpeed);
    const life  = opts.minLife  + Math.random()*(opts.maxLife  - opts.minLife);
    particles.push({
      x, y,
      vx: Math.cos(angle)*speed,
      vy: Math.sin(angle)*speed,
      life, maxLife: life,
      r: opts.r, g: opts.g, b: opts.b,
      size: opts.size + Math.random()*opts.sizeVar,
      gravity: opts.gravity || 0,
    });
  }
}

function spawnExplosion(x, y, r, g, b) {
  spawnParticles(x,y,14,{angle:undefined,spread:0,minSpeed:60,maxSpeed:210,minLife:0.3,maxLife:0.7,r,g,b,size:3,sizeVar:3,gravity:40});
  spawnParticles(x,y,6, {angle:undefined,spread:0,minSpeed:20,maxSpeed:80, minLife:0.4,maxLife:0.9,r:255,g:255,b:200,size:2,sizeVar:2,gravity:0});
}

function spawnImpact(x, y) {
  spawnParticles(x,y,5,{angle:undefined,spread:0,minSpeed:40,maxSpeed:120,minLife:0.1,maxLife:0.25,r:255,g:220,b:80,size:2,sizeVar:1,gravity:0});
}

function spawnMuzzle(x, y, angle) {
  spawnParticles(x,y,5,{angle,spread:0.6,minSpeed:80,maxSpeed:180,minLife:0.04,maxLife:0.1,r:255,g:220,b:100,size:2,sizeVar:2,gravity:0});
}

function updateParticles(dt) {
  for (let i=particles.length-1; i>=0; i--) {
    const p = particles[i];
    p.x  += p.vx * dt;
    p.y  += p.vy * dt;
    p.vy += p.gravity * dt;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i,1);
  }
}

function drawParticles() {
  for (const p of particles) {
    const a = Math.max(0, p.life / p.maxLife);
    const s = p.size * a;
    ctx.globalAlpha = a;
    ctx.fillStyle = `rgb(${p.r},${p.g},${p.b})`;
    ctx.fillRect(p.x - s/2, p.y - s/2, s, s);
  }
  ctx.globalAlpha = 1;
}

// ============================================================
// 7. SPRITE DRAW HELPERS
// ============================================================

function drawPlayer(p) {
  ctx.save();
  ctx.translate(p.x, p.y);

  // Legs (drawn first — behind body)
  const legBob1 =  Math.sin(p.legPhase) * 4;
  const legBob2 = -Math.sin(p.legPhase) * 4;
  ctx.fillStyle = PAL.playerLegs;
  ctx.fillRect(-5, 6 + legBob1, 5, 8);
  ctx.fillRect( 1, 6 + legBob2, 5, 8);

  // Rotate for gun arm + body
  ctx.rotate(p.angle);

  // Gun arm
  ctx.fillStyle = PAL.playerGun;
  ctx.fillRect(4, -2, 16, 5);

  // Muzzle flash
  if (p.flashTimer > 0) {
    const ft = p.flashTimer / 0.08;
    ctx.save();
    ctx.translate(20, 0);
    ctx.globalAlpha = ft;
    ctx.fillStyle = '#fff';
    for (let i=0; i<4; i++) {
      ctx.save();
      ctx.rotate(i * Math.PI/4 + p.flashRot);
      ctx.fillRect(-1, -6, 2, 12);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // Body
  ctx.fillStyle = PAL.playerBody;
  ctx.fillRect(-8, -9, 16, 14);

  // Body highlight
  ctx.fillStyle = PAL.playerHead;
  ctx.fillRect(-6, -7, 6, 4);

  // Head
  ctx.fillStyle = PAL.playerHead;
  ctx.beginPath();
  ctx.arc(0, -7, 6, 0, Math.PI*2);
  ctx.fill();

  // Eye
  ctx.fillStyle = '#001833';
  ctx.beginPath();
  ctx.arc(4, -8, 2, 0, Math.PI*2);
  ctx.fill();

  // Invincibility flicker
  if (p.invincible > 0 && Math.floor(p.invincible*12)%2 === 0) {
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(0, 0, 12, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

function drawEnemy(e) {
  ctx.save();
  ctx.translate(e.x, e.y);

  // Hit flash white overlay
  if (e.hitFlash > 0) {
    ctx.globalAlpha = e.hitFlash;
  }

  switch(e.type) {
    case 'runner': {
      const bob = Math.sin(e.animT * 5) * 2;
      ctx.translate(0, bob);
      ctx.fillStyle = PAL.runnerDark;
      ctx.fillRect(-9, -9, 18, 18);
      ctx.fillStyle = PAL.runner;
      ctx.fillRect(-7, -7, 14, 14);
      // Eyes
      ctx.fillStyle = '#ffeecc';
      ctx.beginPath(); ctx.arc(-3, -2, 3, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc( 3, -2, 3, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#111';
      ctx.beginPath(); ctx.arc(-2, -2, 1.5, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc( 4, -2, 1.5, 0, Math.PI*2); ctx.fill();
      break;
    }
    case 'scout': {
      ctx.rotate(e.animT * 5);
      ctx.fillStyle = PAL.scoutDark;
      ctx.beginPath();
      ctx.moveTo(0,-11); ctx.lineTo(11,0); ctx.lineTo(0,11); ctx.lineTo(-11,0);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = PAL.scout;
      ctx.beginPath();
      ctx.moveTo(0,-8); ctx.lineTo(8,0); ctx.lineTo(0,8); ctx.lineTo(-8,0);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#fff8cc';
      ctx.beginPath(); ctx.arc(0, 0, 3, 0, Math.PI*2); ctx.fill();
      break;
    }
    case 'tank': {
      const wobble = Math.sin(e.animT * 2) * 1;
      // Treads
      ctx.fillStyle = PAL.tankDark;
      ctx.fillRect(-12, -14+wobble, 24, 6);
      ctx.fillRect(-12,  8+wobble,  24, 6);
      // Body
      ctx.fillStyle = PAL.tank;
      ctx.fillRect(-11, -9, 22, 18);
      // Turret
      ctx.fillStyle = PAL.tankDark;
      ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = PAL.tank;
      ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI*2); ctx.fill();
      // Barrel (points toward player direction)
      ctx.rotate(e.angleToPlayer || 0);
      ctx.fillStyle = PAL.tankDark;
      ctx.fillRect(0, -3, 14, 6);
      // Low HP tint
      if (e.hp < e.maxHp * 0.5) {
        ctx.globalAlpha = 0.4;
        ctx.fillStyle = '#ff0000';
        ctx.fillRect(-11, -9, 22, 18);
        ctx.globalAlpha = 1;
      }
      break;
    }
    case 'ranged': {
      const pulse = Math.sin(e.animT * 4) * 2;
      ctx.fillStyle = PAL.rangedDark;
      ctx.beginPath(); ctx.arc(0, 0, 11+pulse, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = PAL.ranged;
      ctx.beginPath(); ctx.arc(0, 0, 9+pulse, 0, Math.PI*2); ctx.fill();
      // Barrel
      ctx.rotate(e.angleToPlayer || 0);
      ctx.fillStyle = PAL.rangedDark;
      ctx.fillRect(6, -3, 12, 6);
      // Charge indicator (flashes red when about to shoot)
      if (e.shootTimer < 0.5) {
        ctx.globalAlpha = (0.5 - e.shootTimer) / 0.5;
        ctx.fillStyle = '#ff0000';
        ctx.beginPath(); ctx.arc(0, 0, 9+pulse, 0, Math.PI*2); ctx.fill();
        ctx.globalAlpha = 1;
      }
      break;
    }
  }

  ctx.globalAlpha = 1;
  ctx.restore();

  // HP bar above enemy (only if damaged)
  if (e.hp < e.maxHp) {
    const bw = 24, bh = 3;
    const bx = e.x - bw/2, by = e.y - e.radius - 8;
    ctx.fillStyle = '#300';
    ctx.fillRect(bx, by, bw, bh);
    const pct = e.hp / e.maxHp;
    ctx.fillStyle = pct > 0.5 ? '#0d0' : pct > 0.25 ? '#dd0' : '#d00';
    ctx.fillRect(bx, by, bw*pct, bh);
  }
}

function drawBullet(b) {
  ctx.save();
  ctx.translate(b.x, b.y);
  if (b.owner === 'player') {
    ctx.rotate(Math.atan2(b.vy, b.vx));
    ctx.fillStyle = PAL.bulletGlow;
    ctx.fillRect(-8, -3, 16, 6);
    ctx.fillStyle = PAL.bullet;
    ctx.fillRect(-7, -2, 14, 4);
  } else {
    ctx.fillStyle = PAL.eBullet;
    ctx.beginPath(); ctx.arc(0,0,4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ff9090';
    ctx.beginPath(); ctx.arc(0,0,2,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawBackground(gameTime) {
  ctx.fillStyle = PAL.bg;
  ctx.fillRect(0,0,W,H);
  const gs = 40;
  const ox = (gameTime * 8) % gs;
  const oy = (gameTime * 6) % gs;
  ctx.strokeStyle = PAL.grid;
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = -gs + ox; x < W+gs; x+=gs) { ctx.moveTo(x,0); ctx.lineTo(x,H); }
  for (let y = -gs + oy; y < H+gs; y+=gs) { ctx.moveTo(0,y); ctx.lineTo(W,y); }
  ctx.stroke();
}

// Crosshair cursor
function drawCursor() {
  const {x,y} = mouse;
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1.5;
  ctx.globalAlpha = 0.9;
  const r=8, gap=4;
  ctx.beginPath();
  ctx.moveTo(x-r-gap,y); ctx.lineTo(x-gap,y);
  ctx.moveTo(x+gap,y);   ctx.lineTo(x+r+gap,y);
  ctx.moveTo(x,y-r-gap); ctx.lineTo(x,y-gap);
  ctx.moveTo(x,y+gap);   ctx.lineTo(x,y+r+gap);
  ctx.stroke();
  ctx.beginPath(); ctx.arc(x,y,2,0,Math.PI*2);
  ctx.fillStyle='#fff'; ctx.fill();
  ctx.globalAlpha=1;
}

// ============================================================
// 8. ENTITY CLASSES
// ============================================================

class Player {
  constructor() {
    this.x = W/2; this.y = H/2;
    this.hp = 100; this.maxHp = 100;
    this.angle = 0;
    this.vx = 0; this.vy = 0;
    this.fireTimer  = 0;
    this.flashTimer = 0;
    this.flashRot   = 0;
    this.legPhase   = 0;
    this.ammo       = AMMO_MAX;
    this.reloading  = false;
    this.reloadTimer = 0;
    this.invincible  = 0;
    this.radius = 10;
    this.bulletsShot = 0;
    this.bulletsHit  = 0;
  }

  update(dt) {
    // Movement
    let dx=0, dy=0;
    if (keys['ArrowLeft']  || keys['a'] || keys['A']) dx -= 1;
    if (keys['ArrowRight'] || keys['d'] || keys['D']) dx += 1;
    if (keys['ArrowUp']    || keys['w'] || keys['W']) dy -= 1;
    if (keys['ArrowDown']  || keys['s'] || keys['S']) dy += 1;
    if (dx!==0 && dy!==0) { dx *= 0.707; dy *= 0.707; }

    this.x += dx * PLAYER_SPEED * dt;
    this.y += dy * PLAYER_SPEED * dt;
    this.x = Math.max(14, Math.min(W-14, this.x));
    this.y = Math.max(14, Math.min(H-14, this.y));

    const moving = dx!==0 || dy!==0;
    if (moving) this.legPhase += dt * 9;

    // Aim
    this.angle = Math.atan2(mouse.y - this.y, mouse.x - this.x);

    // Timers
    this.fireTimer   = Math.max(0, this.fireTimer - dt);
    this.flashTimer  = Math.max(0, this.flashTimer - dt);
    this.invincible  = Math.max(0, this.invincible - dt);

    // Reload
    if (this.reloading) {
      this.reloadTimer -= dt;
      if (this.reloadTimer <= 0) {
        this.ammo = AMMO_MAX;
        this.reloading = false;
        sfxReload();
      }
    } else if ((keys['r'] || keys['R']) && this.ammo < AMMO_MAX) {
      this.startReload();
    }

    // Shoot
    if (mouse.down && this.fireTimer <= 0 && !this.reloading && this.ammo > 0) {
      this.shoot();
    }
  }

  startReload() {
    if (this.reloading) return;
    this.reloading = true;
    this.reloadTimer = RELOAD_TIME;
    sfxReload();
  }

  shoot() {
    const gx = this.x + Math.cos(this.angle)*20;
    const gy = this.y + Math.sin(this.angle)*20;
    bullets.push(new Bullet(gx, gy, this.angle, 'player'));
    this.ammo--;
    this.fireTimer  = FIRE_RATE;
    this.flashTimer = 0.08;
    this.flashRot   = Math.random()*Math.PI;
    this.bulletsShot++;
    spawnMuzzle(gx, gy, this.angle);
    sfxShoot();
    if (this.ammo <= 0) this.startReload();
  }

  takeDamage(amt) {
    if (this.invincible > 0) return;
    this.hp -= amt;
    this.invincible = 1.2;
    spawnImpact(this.x, this.y);
    sfxPlayerHit();
  }

  draw() { drawPlayer(this); }
}

class Enemy {
  constructor(type, x, y) {
    this.type = type;
    this.x = x; this.y = y;
    this.animT = 0;
    this.dead  = false;
    this.hitFlash = 0;
    this.angleToPlayer = 0;
    this.wanderTimer = 0;
    this.wanderOffset = 0;

    const cfg = {
      runner: { r:10, hp:30,  speed:92,  score:100, dmg:18 },
      scout:  { r:8,  hp:15,  speed:155, score:150, dmg:12 },
      tank:   { r:16, hp:120, speed:46,  score:300, dmg:25 },
      ranged: { r:10, hp:25,  speed:68,  score:200, dmg:12 },
    }[type];
    this.radius = cfg.r;
    this.maxHp  = cfg.hp;
    this.hp     = cfg.hp;
    this.speed  = cfg.speed;
    this.score  = cfg.score;
    this.contactDmg = cfg.dmg;

    this.shootTimer = 1.5 + Math.random()*2;
  }

  update(dt, player) {
    this.animT += dt;
    this.hitFlash = Math.max(0, this.hitFlash - dt*6);

    const dx = player.x - this.x;
    const dy = player.y - this.y;
    const dist = Math.sqrt(dx*dx + dy*dy) || 1;
    const baseAngle = Math.atan2(dy, dx);
    this.angleToPlayer = baseAngle;

    let moveAngle = baseAngle;

    switch(this.type) {
      case 'runner':
        this.x += Math.cos(moveAngle)*this.speed*dt;
        this.y += Math.sin(moveAngle)*this.speed*dt;
        break;

      case 'scout':
        this.wanderTimer -= dt;
        if (this.wanderTimer <= 0) {
          this.wanderOffset = (Math.random()-0.5) * Math.PI * 0.7;
          this.wanderTimer  = 0.3 + Math.random()*0.5;
        }
        moveAngle = baseAngle + this.wanderOffset;
        this.x += Math.cos(moveAngle)*this.speed*dt;
        this.y += Math.sin(moveAngle)*this.speed*dt;
        break;

      case 'tank':
        this.x += Math.cos(moveAngle)*this.speed*dt;
        this.y += Math.sin(moveAngle)*this.speed*dt;
        break;

      case 'ranged': {
        const preferred = 190;
        if (dist > preferred + 20) {
          this.x += Math.cos(moveAngle)*this.speed*dt;
          this.y += Math.sin(moveAngle)*this.speed*dt;
        } else if (dist < preferred - 20) {
          this.x -= Math.cos(moveAngle)*this.speed*0.7*dt;
          this.y -= Math.sin(moveAngle)*this.speed*0.7*dt;
        }
        this.shootTimer -= dt;
        if (this.shootTimer <= 0) {
          const bangle = Math.atan2(player.y-this.y, player.x-this.x);
          bullets.push(new Bullet(this.x, this.y, bangle, 'enemy'));
          this.shootTimer = 2 + Math.random()*2;
        }
        break;
      }
    }

    // Clamp to canvas with margin
    this.x = Math.max(-30, Math.min(W+30, this.x));
    this.y = Math.max(-30, Math.min(H+30, this.y));
  }

  takeDamage(amt) {
    this.hp -= amt;
    this.hitFlash = 1;
    sfxHit();
    if (this.hp <= 0) {
      this.dead = true;
      const clr = { runner:[224,80,32], scout:[224,160,0], tank:[128,64,192], ranged:[208,64,160] }[this.type];
      spawnExplosion(this.x, this.y, clr[0], clr[1], clr[2]);
      sfxExplode();
      return true;
    }
    return false;
  }

  draw() { drawEnemy(this); }
}

class Bullet {
  constructor(x, y, angle, owner) {
    this.x = x; this.y = y;
    this.vx = Math.cos(angle)*BULLET_SPEED * (owner==='enemy' ? ENEMY_BULLET_SPEED/BULLET_SPEED : 1);
    this.vy = Math.sin(angle)*BULLET_SPEED * (owner==='enemy' ? ENEMY_BULLET_SPEED/BULLET_SPEED : 1);
    this.owner  = owner;
    this.radius = owner==='player' ? 5 : 5;
    this.damage = owner==='player' ? 10 : 14;
    this.dead   = false;
  }

  update(dt) {
    this.x += this.vx*dt;
    this.y += this.vy*dt;
    if (this.x<-30||this.x>W+30||this.y<-30||this.y>H+30) this.dead=true;
  }

  draw() { drawBullet(this); }
}

// ============================================================
// 9. COLLISION DETECTION
// ============================================================

function circlesOverlap(a, b) {
  const dx=a.x-b.x, dy=a.y-b.y;
  const r=a.radius+b.radius;
  return dx*dx+dy*dy < r*r;
}

function runCollision(player) {
  // Player bullets vs enemies
  for (let b=bullets.length-1; b>=0; b--) {
    const bul = bullets[b];
    if (bul.owner !== 'player' || bul.dead) continue;
    for (let e=enemies.length-1; e>=0; e--) {
      const en = enemies[e];
      if (circlesOverlap(bul, en)) {
        const killed = en.takeDamage(bul.damage);
        bul.dead = true;
        spawnImpact(bul.x, bul.y);
        if (killed) {
          score += en.score;
          player.bulletsHit++;
          waveKills++;
          enemies.splice(e,1);
        }
        break;
      }
    }
  }

  // Enemy bullets vs player
  for (let b=bullets.length-1; b>=0; b--) {
    const bul = bullets[b];
    if (bul.owner !== 'enemy' || bul.dead) continue;
    if (circlesOverlap(bul, player)) {
      player.takeDamage(bul.damage);
      bul.dead = true;
      spawnImpact(bul.x, bul.y);
    }
  }

  // Enemies vs player (contact)
  for (const en of enemies) {
    if (circlesOverlap(en, player)) {
      player.takeDamage(en.contactDmg);
    }
  }

  // Enemy-enemy soft separation
  for (let i=0; i<enemies.length; i++) {
    for (let j=i+1; j<enemies.length; j++) {
      const a=enemies[i], b=enemies[j];
      const dx=a.x-b.x, dy=a.y-b.y;
      const dist2=dx*dx+dy*dy;
      const minD=a.radius+b.radius+2;
      if (dist2 < minD*minD && dist2 > 0.01) {
        const dist=Math.sqrt(dist2);
        const push=(minD-dist)/dist*0.5;
        a.x+=dx*push; a.y+=dy*push;
        b.x-=dx*push; b.y-=dy*push;
      }
    }
  }

  // Remove dead bullets
  for (let i=bullets.length-1; i>=0; i--) {
    if (bullets[i].dead) bullets.splice(i,1);
  }
}

// ============================================================
// 10. HUD
// ============================================================

function drawHUD(player) {
  ctx.save();

  // HP bar
  const hbx=14, hby=14, hbw=160, hbh=14;
  ctx.fillStyle = PAL.uiBg;
  ctx.fillRect(hbx-2, hby-2, hbw+4, hbh+4);
  ctx.fillStyle = '#300';
  ctx.fillRect(hbx, hby, hbw, hbh);
  const hpPct = Math.max(0, player.hp/player.maxHp);
  const pulse = hpPct < 0.3 ? 0.6+0.4*Math.sin(Date.now()/120) : 1;
  ctx.globalAlpha = pulse;
  ctx.fillStyle = hpPct > 0.5 ? PAL.hpFull : hpPct > 0.25 ? PAL.hpMid : PAL.hpLow;
  ctx.fillRect(hbx, hby, hbw*hpPct, hbh);
  ctx.globalAlpha = 1;
  ctx.fillStyle = PAL.uiText;
  ctx.font = 'bold 10px monospace';
  ctx.fillText(`HP  ${player.hp}/${player.maxHp}`, hbx+4, hby+11);

  // Ammo
  const amx=14, amy=36;
  ctx.fillStyle = PAL.uiBg;
  ctx.fillRect(amx-2, amy-2, 180, 14);
  if (player.reloading) {
    const rPct = 1 - player.reloadTimer/RELOAD_TIME;
    ctx.fillStyle='#444';
    ctx.fillRect(amx, amy, 160, 10);
    ctx.fillStyle='#ffaa00';
    ctx.fillRect(amx, amy, 160*rPct, 10);
    ctx.fillStyle=PAL.uiText;
    ctx.font='bold 9px monospace';
    ctx.fillText('RELOADING...', amx+4, amy+9);
  } else {
    for (let i=0; i<AMMO_MAX; i++) {
      ctx.fillStyle = i < player.ammo ? PAL.bullet : '#333';
      ctx.fillRect(amx + i*7, amy, 5, 10);
    }
  }

  // Score
  ctx.fillStyle = PAL.uiBg;
  ctx.fillRect(W-170, 10, 158, 18);
  ctx.fillStyle = '#ffdd44';
  ctx.font = 'bold 14px monospace';
  ctx.textAlign = 'right';
  ctx.fillText(`${score}`, W-14, 24);
  ctx.fillStyle = PAL.uiText;
  ctx.font = '10px monospace';
  ctx.fillText('SCORE', W-14, 14);

  // Level / wave
  ctx.textAlign = 'right';
  ctx.fillStyle = PAL.uiBg;
  ctx.fillRect(W-150, H-40, 138, 30);
  ctx.fillStyle = '#aaccff';
  ctx.font = 'bold 11px monospace';
  ctx.fillText(LEVELS[currentLevel].name, W-14, H-24);
  ctx.fillStyle = PAL.uiText;
  ctx.font = '10px monospace';
  ctx.fillText(`WAVE  ${currentWave+1} / ${LEVELS[currentLevel].waves.length}`, W-14, H-10);

  ctx.textAlign = 'left';
  ctx.restore();
}

// ============================================================
// 11. SCREEN RENDERERS
// ============================================================

let menuParticles = [];
function initMenuParticles() {
  menuParticles = [];
  for (let i=0;i<25;i++) {
    menuParticles.push({
      x:Math.random()*W, y:Math.random()*H,
      vx:(Math.random()-0.5)*18, vy:(Math.random()-0.5)*18,
      r:50+Math.random()*100, g:30+Math.random()*60, b:180+Math.random()*75,
      size:Math.random()*3+1,
    });
  }
}

function drawMenu(dt) {
  ctx.fillStyle='#08081a';
  ctx.fillRect(0,0,W,H);

  // Drifting bg particles
  for (const p of menuParticles) {
    p.x=(p.x+p.vx*dt+W)%W;
    p.y=(p.y+p.vy*dt+H)%H;
    ctx.globalAlpha=0.5;
    ctx.fillStyle=`rgb(${p.r},${p.g},${p.b})`;
    ctx.fillRect(p.x,p.y,p.size,p.size);
    ctx.globalAlpha=1;
  }

  // Title shadow
  ctx.font='bold 72px monospace';
  ctx.textAlign='center';
  ctx.fillStyle='#2020aa';
  ctx.fillText('SECTOR ZERO',W/2+3,H/2-80+3);
  // Title
  ctx.fillStyle='#6688ff';
  ctx.fillText('SECTOR ZERO',W/2,H/2-80);

  ctx.font='bold 16px monospace';
  ctx.fillStyle='#8899cc';
  ctx.fillText('A RETRO TOP-DOWN SHOOTER',W/2,H/2-40);

  const blink = Math.floor(Date.now()/500)%2===0;
  if (blink) {
    ctx.fillStyle='#aaccff';
    ctx.font='bold 18px monospace';
    ctx.fillText('CLICK OR PRESS ENTER TO START',W/2,H/2+20);
  }

  ctx.font='12px monospace';
  ctx.fillStyle='#556688';
  ctx.fillText('MOVE: ARROW KEYS / WASD    AIM & SHOOT: MOUSE    RELOAD: R',W/2,H/2+70);

  const hs = localStorage.getItem('sz_hs')||0;
  ctx.fillStyle='#ffdd44';
  ctx.font='bold 13px monospace';
  ctx.fillText(`HIGH SCORE: ${hs}`,W/2,H/2+100);

  // Enemy preview row
  const types=['runner','scout','tank','ranged'];
  const labels=['RUNNER\n100pts','SCOUT\n150pts','TANK\n300pts','RANGED\n200pts'];
  for (let i=0;i<4;i++) {
    const ex=W/2-180+i*120, ey=H/2+170;
    drawEnemy({type:types[i],x:ex,y:ey,animT:Date.now()/1000,hp:30,maxHp:30,hitFlash:0,radius:10,angleToPlayer:0,shootTimer:99,wanderTimer:0,wanderOffset:0});
    ctx.fillStyle='#556688';
    ctx.font='10px monospace';
    ctx.fillText(labels[i].split('\n')[0], ex, ey+22);
    ctx.fillText(labels[i].split('\n')[1], ex, ey+34);
  }

  ctx.textAlign='left';
}

function drawWaveClear(waveClearTimer) {
  const totalTime = 2.5;
  const alpha = Math.min(1, waveClearTimer / totalTime);
  ctx.fillStyle=`rgba(0,0,0,0.55)`;
  ctx.fillRect(W/2-180,H/2-60,360,120);
  ctx.textAlign='center';
  ctx.fillStyle='#20dd60';
  ctx.font='bold 36px monospace';
  ctx.fillText('WAVE CLEAR!',W/2,H/2-10);
  ctx.fillStyle='#aaccff';
  ctx.font='14px monospace';
  ctx.fillText(`+${waveScore} pts  |  ${waveKills} enemies`,W/2,H/2+20);
  // Countdown bar
  const bw=200, bh=6, bx=W/2-100, by=H/2+45;
  ctx.fillStyle='#222';
  ctx.fillRect(bx,by,bw,bh);
  ctx.fillStyle='#20dd60';
  ctx.fillRect(bx,by,bw*(waveClearTimer/totalTime),bh);
  ctx.textAlign='left';
}

function drawLevelClear() {
  ctx.fillStyle='rgba(0,0,20,0.88)';
  ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.fillStyle='#ffdd44';
  ctx.font='bold 48px monospace';
  ctx.fillText(`${LEVELS[currentLevel].name}`,W/2,H/2-80);
  ctx.fillStyle='#aaccff';
  ctx.font='bold 22px monospace';
  ctx.fillText('SECTOR COMPLETE',W/2,H/2-40);
  ctx.font='14px monospace';
  ctx.fillStyle='#7788aa';
  ctx.fillText(`SCORE: ${score}`,W/2,H/2+10);
  const acc = player.bulletsShot > 0 ? Math.round(player.bulletsHit/player.bulletsShot*100) : 0;
  ctx.fillText(`ACCURACY: ${acc}%`,W/2,H/2+32);

  const blink=Math.floor(Date.now()/500)%2===0;
  if (blink) {
    ctx.fillStyle='#aaccff';
    ctx.font='bold 16px monospace';
    ctx.fillText('PRESS ENTER TO CONTINUE',W/2,H/2+75);
  }
  ctx.textAlign='left';
}

function drawVictory() {
  ctx.fillStyle='rgba(0,0,10,0.92)';
  ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.fillStyle='#ffdd44';
  ctx.font='bold 52px monospace';
  ctx.fillText('VICTORY!',W/2,H/2-90);
  ctx.fillStyle='#20dd60';
  ctx.font='bold 18px monospace';
  ctx.fillText('ALL SECTORS CLEARED',W/2,H/2-48);
  ctx.fillStyle='#aaccff';
  ctx.font='14px monospace';
  ctx.fillText(`FINAL SCORE: ${score}`,W/2,H/2);
  const acc = player && player.bulletsShot>0 ? Math.round(player.bulletsHit/player.bulletsShot*100) : 0;
  ctx.fillText(`ACCURACY: ${acc}%`,W/2,H/2+24);
  const blink=Math.floor(Date.now()/500)%2===0;
  if (blink) {
    ctx.fillStyle='#aaccff';
    ctx.font='bold 16px monospace';
    ctx.fillText('PRESS ENTER TO PLAY AGAIN',W/2,H/2+70);
  }
  ctx.textAlign='left';
}

function drawGameOver() {
  ctx.fillStyle='rgba(20,0,0,0.85)';
  ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  // Glitch effect
  const t=Date.now();
  for (let i=0;i<3;i++) {
    const ox=(Math.sin(t/80+i*2)*4)|0;
    ctx.fillStyle=['rgba(255,0,0,0.7)','rgba(0,0,255,0.7)','rgba(255,80,80,0.9)'][i];
    ctx.font='bold 56px monospace';
    ctx.fillText('GAME OVER',W/2+ox,H/2-70);
  }
  ctx.fillStyle='#dd2020';
  ctx.font='bold 56px monospace';
  ctx.fillText('GAME OVER',W/2,H/2-70);
  ctx.fillStyle='#aaccff';
  ctx.font='14px monospace';
  ctx.fillText(`SCORE: ${score}`,W/2,H/2-20);
  const hs=localStorage.getItem('sz_hs')||0;
  if (score>=hs) { ctx.fillStyle='#ffdd44'; ctx.fillText('NEW HIGH SCORE!',W/2,H/2+6); }
  const blink=Math.floor(Date.now()/500)%2===0;
  if (blink) {
    ctx.fillStyle='#aaccff';
    ctx.font='bold 16px monospace';
    ctx.fillText('PRESS ENTER TO RETURN TO MENU',W/2,H/2+50);
  }
  ctx.textAlign='left';
}

// ============================================================
// 12. CRT OVERLAY
// ============================================================

const offscreen = document.createElement('canvas');
offscreen.width=W; offscreen.height=H;
const octx = offscreen.getContext('2d');
octx.fillStyle='rgba(0,0,0,0.10)';
for (let y=0;y<H;y+=2) octx.fillRect(0,y,W,1);
// Vignette
const vg = octx.createRadialGradient(W/2,H/2,H*0.28,W/2,H/2,H*0.82);
vg.addColorStop(0,'rgba(0,0,0,0)');
vg.addColorStop(1,'rgba(0,0,0,0.55)');
octx.fillStyle=vg;
octx.fillRect(0,0,W,H);

function drawCRT() {
  ctx.drawImage(offscreen,0,0);
  // Subtle color fringe
  ctx.globalAlpha=0.04;
  ctx.fillStyle='#ff0000';
  ctx.fillRect(0,0,3,H);
  ctx.fillStyle='#0000ff';
  ctx.fillRect(W-3,0,3,H);
  ctx.globalAlpha=1;
}

// ============================================================
// 13. GAME STATE & WAVE MANAGER
// ============================================================

let state = 'menu'; // menu | playing | waveClear | levelClear | victory | gameOver
let currentLevel = 0;
let currentWave  = 0;
let score        = 0;
let waveScore    = 0;
let waveKills    = 0;
let enemies      = [];
let bullets      = [];
let player       = null;
let gameTime     = 0;
let waveClearTimer = 0;
let levelClearTimer= 0;
let spawnQueues  = [];
let bossFlash    = 0;
let levelClearWaitForEnter = false;

function randomEdgePos() {
  const side = Math.floor(Math.random()*4);
  switch(side) {
    case 0: return { x:Math.random()*W, y:-25 };
    case 1: return { x:Math.random()*W, y:H+25 };
    case 2: return { x:-25, y:Math.random()*H };
    default:return { x:W+25, y:Math.random()*H };
  }
}

function startGame() {
  initAudio();
  currentLevel=0; currentWave=0; score=0;
  enemies=[]; bullets=[]; particles=[];
  player = new Player();
  state='playing';
  gameTime=0;
  startWave();
}

function startWave() {
  const waveDef = LEVELS[currentLevel].waves[currentWave];
  spawnQueues = waveDef.spawns.map(s => ({ ...s, remaining:s.count, timer:s.interval*0.3 }));
  waveScore = 0;
  waveKills = 0;
  enemies = [];
  bullets = [];
  if (waveDef.isBoss) bossFlash = 1.2;
}

function nextWave() {
  currentWave++;
  if (currentWave >= LEVELS[currentLevel].waves.length) {
    // Level clear
    sfxLevelClear();
    if (currentLevel+1 >= LEVELS.length) {
      const hs=localStorage.getItem('sz_hs')||0;
      if (score>hs) localStorage.setItem('sz_hs',score);
      state='victory';
    } else {
      state='levelClear';
      levelClearWaitForEnter=true;
    }
  } else {
    state='playing';
    startWave();
  }
}

function waveComplete() {
  return spawnQueues.every(q=>q.remaining<=0) && enemies.length===0;
}

function updateSpawns(dt) {
  for (const q of spawnQueues) {
    if (q.remaining<=0) continue;
    q.timer -= dt;
    if (q.timer <= 0) {
      const pos = randomEdgePos();
      enemies.push(new Enemy(q.type, pos.x, pos.y));
      q.remaining--;
      q.timer = q.interval;
    }
  }
}

// ============================================================
// 14. MAIN GAME LOOP
// ============================================================

let lastTime = 0;

function loop(timestamp) {
  const dt = Math.min((timestamp - lastTime)/1000, 0.05);
  lastTime = timestamp;

  ctx.clearRect(0,0,W,H);

  switch(state) {
    case 'menu':
      drawMenu(dt);
      if (mouse.justPressed || keys['Enter']) startGame();
      break;

    case 'playing': {
      gameTime += dt;
      bossFlash = Math.max(0, bossFlash-dt);

      drawBackground(gameTime);

      updateSpawns(dt);
      player.update(dt);
      for (const e of enemies) e.update(dt, player);
      for (const b of bullets) b.update(dt);
      updateParticles(dt);

      runCollision(player);

      // Draw game world
      drawParticles();
      for (const e of enemies) e.draw();
      for (const b of bullets) b.draw();
      player.draw();

      // Boss flash overlay
      if (bossFlash > 0) {
        ctx.fillStyle=`rgba(255,0,0,${bossFlash*0.35})`;
        ctx.fillRect(0,0,W,H);
        ctx.textAlign='center';
        ctx.fillStyle=`rgba(255,80,80,${bossFlash})`;
        ctx.font='bold 28px monospace';
        ctx.fillText('! BOSS WAVE !',W/2,H/2);
        ctx.textAlign='left';
      }

      drawHUD(player);

      if (player.hp <= 0) {
        const hs=localStorage.getItem('sz_hs')||0;
        if (score>hs) localStorage.setItem('sz_hs',score);
        state='gameOver';
      } else if (waveComplete()) {
        sfxWaveClear();
        waveScore = score;
        state='waveClear';
        waveClearTimer=2.5;
      }
      break;
    }

    case 'waveClear': {
      gameTime+=dt;
      drawBackground(gameTime);
      drawParticles();
      updateParticles(dt);
      player.draw();
      drawHUD(player);
      waveClearTimer -= dt;
      drawWaveClear(waveClearTimer);
      if (waveClearTimer<=0) nextWave();
      break;
    }

    case 'levelClear': {
      drawLevelClear();
      if (keys['Enter'] || mouse.justPressed) {
        currentLevel++;
        currentWave=0;
        player.bulletsShot=0; player.bulletsHit=0;
        enemies=[]; bullets=[]; particles=[];
        state='playing';
        startWave();
      }
      break;
    }

    case 'victory': {
      drawVictory();
      if (keys['Enter'] || mouse.justPressed) { state='menu'; initMenuParticles(); }
      break;
    }

    case 'gameOver': {
      drawBackground(gameTime);
      drawParticles();
      updateParticles(dt);
      drawGameOver();
      if (keys['Enter'] || mouse.justPressed) { state='menu'; initMenuParticles(); }
      break;
    }
  }

  drawCRT();
  drawCursor();

  mouse.justPressed = false;
  requestAnimationFrame(loop);
}

// ============================================================
// 15. BOOTSTRAP
// ============================================================
initMenuParticles();
requestAnimationFrame(loop);
</script>
