<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f0f1a;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #e0e0e0;
    }

    h1 {
      font-size: 2.2rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
      color: #fff;
    }

    #status {
      font-size: 1.1rem;
      margin-bottom: 1.5rem;
      height: 1.4rem;
      color: #aaa;
      letter-spacing: 1px;
    }

    #status.win  { color: #7ee8a2; font-weight: 600; }
    #status.draw { color: #f7c948; font-weight: 600; }

    #board {
      display: grid;
      grid-template-columns: repeat(3, 110px);
      grid-template-rows:    repeat(3, 110px);
      gap: 10px;
    }

    .cell {
      background: #1e1e30;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      user-select: none;
    }

    .cell:hover:not(.taken) {
      background: #2a2a42;
      transform: scale(1.04);
    }

    .cell.x { color: #7eb8f7; }
    .cell.o { color: #f78eb8; }
    .cell.win-cell { background: #2a3a2a; }

    #restart {
      margin-top: 2rem;
      padding: 0.65rem 2.2rem;
      border: none;
      border-radius: 8px;
      background: #3a3a5c;
      color: #e0e0e0;
      font-size: 1rem;
      letter-spacing: 1px;
      cursor: pointer;
      transition: background 0.15s;
    }

    #restart:hover { background: #4e4e7a; }

    #score {
      display: flex;
      gap: 2.5rem;
      margin-top: 2rem;
      font-size: 0.95rem;
      letter-spacing: 1px;
      color: #888;
    }

    #score span { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    #score .label { font-size: 0.75rem; text-transform: uppercase; }
    #score .x-score { color: #7eb8f7; font-size: 1.4rem; font-weight: 700; }
    #score .o-score { color: #f78eb8; font-size: 1.4rem; font-weight: 700; }
    #score .d-score { font-size: 1.4rem; font-weight: 700; }
  </style>
</head>
<body>

<h1>Tic Tac Toe</h1>
<div id="status">X's turn</div>

<div id="board">
  <div class="cell" data-i="0"></div>
  <div class="cell" data-i="1"></div>
  <div class="cell" data-i="2"></div>
  <div class="cell" data-i="3"></div>
  <div class="cell" data-i="4"></div>
  <div class="cell" data-i="5"></div>
  <div class="cell" data-i="6"></div>
  <div class="cell" data-i="7"></div>
  <div class="cell" data-i="8"></div>
</div>

<button id="restart">Restart</button>

<div id="score">
  <span><div class="label">X wins</div><div class="x-score" id="sx">0</div></span>
  <span><div class="label">Draws</div><div class="d-score" id="sd">0</div></span>
  <span><div class="label">O wins</div><div class="o-score" id="so">0</div></span>
</div>

<script>
  const WINS = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  let board, current, over;
  let score = { X: 0, O: 0, D: 0 };

  const cells  = document.querySelectorAll('.cell');
  const status = document.getElementById('status');

  function init() {
    board   = Array(9).fill('');
    current = 'X';
    over    = false;
    cells.forEach(c => {
      c.textContent = '';
      c.className   = 'cell';
    });
    setStatus(`${current}'s turn`);
  }

  function setStatus(msg, type = '') {
    status.textContent = msg;
    status.className   = type;
  }

  function checkWin(player) {
    return WINS.find(combo => combo.every(i => board[i] === player)) || null;
  }

  function handleClick(e) {
    const idx = +e.target.dataset.i;
    if (over || board[idx]) return;

    board[idx] = current;
    const cell = cells[idx];
    cell.textContent = current;
    cell.classList.add(current.toLowerCase(), 'taken');

    const winCombo = checkWin(current);
    if (winCombo) {
      winCombo.forEach(i => cells[i].classList.add('win-cell'));
      setStatus(`${current} wins!`, 'win');
      score[current]++;
      updateScore();
      over = true;
    } else if (board.every(Boolean)) {
      setStatus("It's a draw!", 'draw');
      score.D++;
      updateScore();
      over = true;
    } else {
      current = current === 'X' ? 'O' : 'X';
      setStatus(`${current}'s turn`);
    }
  }

  function updateScore() {
    document.getElementById('sx').textContent = score.X;
    document.getElementById('so').textContent = score.O;
    document.getElementById('sd').textContent = score.D;
  }

  cells.forEach(c => c.addEventListener('click', handleClick));
  document.getElementById('restart').addEventListener('click', init);

  init();
</script>
</body>
</html>
